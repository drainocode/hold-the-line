name: Kaggle benchmark
on:
  workflow_dispatch:
    inputs:
      step:
        description: "push, models, run, status, publish or leaderboard"
        required: true
        default: push
      models:
        description: "Space-separated model slugs for the run step"
        required: false
        default: ""
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TASK: hold-the-line-contact-centre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -U kaggle jupytext
      - name: Run step
        shell: bash
        run: |
          set +e
          case "${{ inputs.step }}" in
            push)    kaggle benchmarks tasks push "$TASK" -f hold_the_line.py --wait 3000 > out.txt 2>&1 ;;
            example) kaggle benchmarks tasks push what-is-kaggle -f example_check.py --wait 900 > out.txt 2>&1 ;;
            diag2)   { echo "== init"; kaggle benchmarks init -y --env-file /tmp/kb.env --example-file /tmp/ex.py; grep -v KEY /tmp/kb.env; echo "== fresh push"; sed "s/What is Kaggle?/Hello check two/" example_check.py > hello_check_two.py; kaggle benchmarks tasks push hello-check-two -f hello_check_two.py -v; echo "== status"; kaggle benchmarks tasks status hold-the-line-contact-centre; } > out.txt 2>&1 ;;
            reset)   { echo "== init"; kaggle benchmarks init -y --env-file /tmp/kb.env --example-file /tmp/ex.py 2>&1 | head -5; echo "== delete broken"; for s in hold-the-line-contact-centre what-is-kaggle hello-check-two; do yes | kaggle benchmarks tasks delete $s 2>&1 | tail -2; done; echo "== push"; kaggle benchmarks tasks push "$TASK" -f hold_the_line.py --wait 3000; } > out.txt 2>&1 ;;
            list)    kaggle benchmarks tasks list > out.txt 2>&1 ;;
            diag)    { echo "== whoami"; kaggle config view; echo "== auth"; kaggle benchmarks auth --help | head -5; kaggle benchmarks init -h | head -20; echo "== list"; kaggle benchmarks tasks list; echo "== verbose push"; kaggle benchmarks tasks push what-is-kaggle -f example_check.py -v; echo "== kernels"; kaggle kernels list --mine --page-size 5; } > out.txt 2>&1 ;;
            models)  kaggle benchmarks tasks models > out.txt 2>&1 ;;
            run)     args=""; for m in ${{ inputs.models }}; do args="$args -m $m"; done
                     kaggle benchmarks tasks run "$TASK" $args --wait 5400 > out.txt 2>&1 ;;
            status)  kaggle benchmarks tasks status "$TASK" > out.txt 2>&1 ;;
            publish) kaggle benchmarks tasks publish "$TASK" > out.txt 2>&1 ;;
            *)       echo "unknown step" > out.txt ;;
          esac
          code=$?
          cat out.txt
          python3 - <<'PY'
          t = open("out.txt").read()[-60000:]
          t = t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::notice title=result::{t}")
          PY
          exit $code
